name: Claude PR review

# ─────────────────────────────────────────────────────────────────────────────
# REVIEW-PIJPLIJN (v2, 2026-07) — vervangt de agentische claude-code-action.
#
# Waarom: de officiële actie draaide een agentische loop (20-35 tool-rondjes
# per review, gem. $2,37 quota-equivalent) en negeerde onze tool-restricties
# (actie-bug #690). Deze pijplijn doet hetzelfde werk deterministisch:
#
#   bash  → al gereviewd voor deze commit? → klaar (kost $0)
#   bash  → diff + inhoud gewijzigde bestanden + skills verzamelen
#   claude -p → ÉÉN model-call, NUL tools (--tools "" --max-turns 1)
#   bash  → review posten met SHA-marker (exact 1×, gegarandeerd)
#   bash  → live-gang issues aanmaken uit de output (dedup in bash)
#
# Garanties by design (geen prompt-beloftes meer nodig):
#   - Read-only: het model HEEFT geen tools, kan dus niets wijzigen/posten.
#   - Dubbelpost onmogelijk: bash post exact één keer.
#   - Re-run op zelfde commit: gratis (gate vóór de model-call).
#
# NB: comments verschijnen als github-actions[bot] (niet claude[bot]) —
# de Claude GitHub App is voor deze bot niet meer nodig.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Quota-besparing: skip pushes die alleen non-code-bestanden raken.
    # Een MIXED push (code + markdown) triggert wel.
    # Bewust NIET geskipt: .github/** (workflows = supply-chain-relevant).
    paths-ignore:
      - '**.md'
      - '**.lock'
      - 'package-lock.json'
      - 'bun.lockb'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'

  # Handmatige trigger — review op een zelf gekozen model.
  # GitHub > Actions > Claude PR review > Run workflow.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR-nummer om te reviewen'
        required: true
        type: string
      model:
        description: 'Model'
        required: true
        default: 'sonnet'
        type: choice
        options:
          - sonnet
          - opus
          - haiku

# Eén review-run per PR tegelijk; nieuwe push annuleert de lopende run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_MODEL: ${{ inputs.model || 'sonnet' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head

      - name: Checkout reviewer (skills)
        uses: actions/checkout@v4
        with:
          # Wijs naar jóuw fork als je een eigen reviewer-repo beheert.
          repository: wrdejong86/claude-pr-reviewer
          path: .reviewer

      # ── Gate: als deze commit al gereviewd is, stoppen we hier ($0). ──
      - name: Dedup-gate
        id: gate
        run: |
          HEAD_SHA=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid --jq .headRefOid)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          ALREADY=$(gh pr view "$PR_NUMBER" -R "$REPO" --json comments \
            --jq "[.comments[] | select(.body | contains(\"<!-- claude-review:$HEAD_SHA -->\"))] | length")
          if [ "$ALREADY" -gt 0 ]; then
            echo "Commit $HEAD_SHA is al gereviewd — klaar (geen model-call)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Context verzamelen: PR-meta, diff (cap 200KB), inhoud gewijzigde
      #    bestanden (cap 50KB/bestand, 150KB totaal, alleen tekst). ──
      - name: Verzamel PR-context
        if: steps.gate.outputs.skip != 'true'
        run: |
          gh pr view "$PR_NUMBER" -R "$REPO" --json title,body,baseRefName,headRefName > pr-meta.json

          gh pr diff "$PR_NUMBER" -R "$REPO" > diff-full.patch
          head -c 200000 diff-full.patch > diff.patch
          if [ "$(wc -c < diff-full.patch)" -gt 200000 ]; then
            echo "" >> diff.patch
            echo "[... diff afgekapt op 200KB — beoordeel wat zichtbaar is ...]" >> diff.patch
          fi

          : > files.txt
          TOTAL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue                       # verwijderde bestanden overslaan
            grep -Iq . "$f" 2>/dev/null || continue        # binaries overslaan
            [ "$TOTAL" -ge 150000 ] && { echo "[... overige bestanden weggelaten (150KB-cap) ...]" >> files.txt; break; }
            SIZE=$(wc -c < "$f")
            {
              echo ""
              echo "───── BESTAND: $f ─────"
              head -c 50000 "$f"
              [ "$SIZE" -gt 50000 ] && echo "[... bestand afgekapt op 50KB ...]"
            } >> files.txt
            TOTAL=$((TOTAL + (SIZE > 50000 ? 50000 : SIZE)))
          done < <(gh pr diff "$PR_NUMBER" -R "$REPO" --name-only)

      # ── Prompt bouwen: instructies + ALLE skills + meta + diff + bestanden.
      #    In een single-shot call worden skills maar één keer betaald, dus
      #    skill-selectie is onnodig — alles gaat altijd mee. ──
      - name: Bouw prompt
        if: steps.gate.outputs.skip != 'true'
        run: |
          {
            cat <<'INSTR'
          Je bent een senior code-reviewer. Review onderstaande pull request
          grondig aan de hand van de meegeleverde reviewer-skills.

          REGELS:
          - Schrijf de VOLLEDIGE review in het Nederlands (koppen, labels,
            proza). Code-snippets blijven zoals ze zijn.
          - Verwijs naar elke bevinding met `bestand:regel`.
          - Beoordeel alleen code die in de diff staat; de meegeleverde
            bestandsinhoud is context, geen review-doelwit.
          - Verzin geen code die niet in de diff staat.
          - Groepeer bevindingen als: **Blocking** / **Should fix** /
            **Nice to have** / **Positief**. Sla lege categorieën over.
            Is de PR in orde, zeg dat dan gewoon.
          - Loop de diff langs ELKE skill; pas alle relevante toe. Sla een
            skill alleen over als hij echt niet van toepassing is. Begin de
            review met een regel "**Skills toegepast:** ..." zodat de
            dekking controleerbaar is.

          LIVE-GANG (zie skill 15-live-gang): introduceert deze PR iets dat
          vóór productie aandacht nodig heeft (nieuwe cron, env-vars,
          destructieve migratie, nieuwe PII, externe service, ...)? Lever
          dan per onderwerp een issue-blok aan volgens het format hieronder
          (max 5). Volg voor de issue-body het format uit skill 15, maar
          ZONDER de verborgen marker (die wordt automatisch toegevoegd).
          Niets relevant? Lever dan geen issue-blokken.

          OUTPUT-FORMAT — houd je hier EXACT aan, niets ervoor of erna:

          ===REVIEW===
          <de volledige review in markdown>
          ===END-REVIEW===
          ===ISSUE===
          TITEL: <korte titel zonder emoji-prefix>
          <issue-body in markdown>
          ===ISSUE===
          TITEL: ...
          <body>
          ===END===

          (Geen live-gang issues? Dan direct ===END=== na ===END-REVIEW===.)
          INSTR

            echo ""
            echo "=============== PR-METADATA ==============="
            echo "Repository: $REPO — PR #$PR_NUMBER"
            echo "Titel: $(jq -r '.title' pr-meta.json)"
            echo "Branch: $(jq -r '.headRefName' pr-meta.json) -> $(jq -r '.baseRefName' pr-meta.json)"
            echo "--- PR-beschrijving ---"
            jq -r '.body // "(geen beschrijving)"' pr-meta.json

            echo ""
            echo "=============== REVIEWER SKILLS ==============="
            cat .reviewer/skills/[0-9]*.md

            echo ""
            echo "=============== DIFF ==============="
            cat diff.patch

            echo ""
            echo "=============== VOLLEDIGE INHOUD GEWIJZIGDE BESTANDEN (context) ==============="
            cat files.txt
          } > prompt.md
          echo "Promptgrootte: $(wc -c < prompt.md) bytes"

      # ── Eén model-call, nul tools. ──
      - name: Installeer Claude Code CLI
        if: steps.gate.outputs.skip != 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Review (één claude-call, geen tools)
        if: steps.gate.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat prompt.md | claude -p \
            --output-format json \
            --tools "" \
            --max-turns 1 \
            --model "$REVIEW_MODEL" > out.json

          jq -r '.result // empty' out.json > result.txt
          if [ ! -s result.txt ]; then
            echo "::error::Lege model-output"; cat out.json; exit 1
          fi
          COST=$(jq -r '.total_cost_usd // "?"' out.json)
          DUR=$(jq -r '.duration_ms // 0' out.json)
          echo "### 🤖 Review-bot" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: \`$REVIEW_MODEL\` · Kosten: \$$COST · Modelduur: $((DUR/1000))s" >> "$GITHUB_STEP_SUMMARY"

      # ── Output parsen, live-gang issues aanmaken, review 1× posten. ──
      - name: Post review + live-gang issues
        if: steps.gate.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          awk '/^===REVIEW===$/{f=1;next} /^===END-REVIEW===$/{f=0} f' result.txt > review-body.md
          if [ ! -s review-body.md ]; then
            echo "::error::Geen ===REVIEW===-blok in model-output"; head -50 result.txt; exit 1
          fi

          rm -f issue-*.txt
          awk '/^===END-REVIEW===$/{p=1;next} /^===END===$/{exit}
               p && /^===ISSUE===$/{n++; fname=sprintf("issue-%d.txt",n); next}
               p && n>0 {print >> fname}' result.txt

          # Live-gang issues: max 5, alleen als deze PR nog niet getriaged is.
          LINKS=""
          EXISTING=$(gh issue list -R "$REPO" --label "live-gang" --state open --json body \
            --jq "[.[] | select(.body | contains(\"<!-- live-gang:PR-$PR_NUMBER -->\"))] | length" 2>/dev/null || echo 0)
          if [ "$EXISTING" -eq 0 ]; then
            COUNT=0
            for f in issue-1.txt issue-2.txt issue-3.txt issue-4.txt issue-5.txt; do
              [ -f "$f" ] || continue
              TITLE=$(head -1 "$f" | sed 's/^TITEL:[[:space:]]*//')
              [ -n "$TITLE" ] || continue
              {
                echo "<!-- live-gang:PR-$PR_NUMBER -->"
                echo "> Gedetecteerd door reviewer-bot in PR #$PR_NUMBER."
                echo ""
                tail -n +2 "$f"
              } > issue-body.md
              URL=$(gh issue create -R "$REPO" \
                --title "🚀 Live-gang: $TITLE" \
                --label "live-gang" \
                --body-file issue-body.md)
              LINKS="$LINKS- $URL"$'\n'
              COUNT=$((COUNT+1))
            done
            echo "Live-gang issues aangemaakt: $COUNT"
          else
            echo "Live-gang triage bestaat al voor PR #$PR_NUMBER — geen nieuwe issues."
          fi

          # Review-comment: marker + review + evt. issue-links. Exact één post.
          {
            echo "<!-- claude-review:$HEAD_SHA -->"
            cat review-body.md
            if [ -n "$LINKS" ]; then
              echo ""
              echo "### 🚀 Live-gang aandachtspunten"
              printf '%s' "$LINKS"
            fi
          } > final-comment.md
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file final-comment.md
          echo "Review gepost voor commit $HEAD_SHA."
